<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shopping Cart</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #ff6b35;
      --dark:   #1a1a2e;
      --card-bg:#fff;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6fb;
      color: #333;
      min-height: 100vh;
    }

    /* ─── TOP NAV ─── */
    nav {
      background: var(--dark);
      padding: .9rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    nav .logo { color: #fff; font-size: 1.3rem; font-weight: 700; }
    .cart-icon {
      position: relative;
      cursor: pointer;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
    }
    .cart-badge {
      position: absolute;
      top: -6px; right: -8px;
      background: var(--accent);
      color: #fff;
      font-size: .65rem;
      font-weight: 700;
      border-radius: 50%;
      width: 18px; height: 18px;
      display: flex; align-items: center; justify-content: center;
    }

    /* ─── MAIN LAYOUT ─── */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1rem;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 2rem;
    }
    @media(max-width:820px) { main { grid-template-columns: 1fr; } }

    h2 { font-size: 1.3rem; color: var(--dark); margin-bottom: 1.2rem; }

    /* ─── PRODUCT GRID ─── */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.2rem;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 3px 14px rgba(0,0,0,.08);
      transition: transform .25s, box-shadow .25s;
      display: flex;
      flex-direction: column;
    }
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 28px rgba(0,0,0,.13);
    }
    .product-card img {
      width: 100%; aspect-ratio: 1;
      object-fit: cover;
    }
    .product-info {
      padding: .8rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: .3rem;
    }
    .product-info .p-name { font-weight: 600; font-size: .95rem; }
    .product-info .p-cat  { font-size: .75rem; color: #888; text-transform: uppercase; }
    .product-info .p-price{ font-size: 1.1rem; font-weight: 700; color: var(--accent); margin-top: auto; }
    .product-info .p-rating{ font-size: .8rem; color: #f5a623; }

    .btn-add {
      margin: 0 .8rem .8rem;
      padding: .55rem;
      background: var(--dark);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: .85rem;
      font-weight: 600;
      transition: background .2s;
    }
    .btn-add:hover     { background: var(--accent); }
    .btn-add.in-cart   { background: #28a745; }

    /* ─── CART SIDEBAR ─── */
    .cart-sidebar {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,.1);
      padding: 1.4rem;
      height: fit-content;
      position: sticky;
      top: 1.5rem;
    }

    .cart-items { max-height: 340px; overflow-y: auto; margin-bottom: 1rem; }

    .cart-item {
      display: flex;
      align-items: center;
      gap: .8rem;
      padding: .7rem 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .cart-item img {
      width: 52px; height: 52px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .ci-info { flex: 1; }
    .ci-info .ci-name  { font-weight: 600; font-size: .88rem; }
    .ci-info .ci-price { font-size: .85rem; color: var(--accent); }
    .ci-qty {
      display: flex;
      align-items: center;
      gap: .3rem;
    }
    .ci-qty button {
      width: 26px; height: 26px;
      border: 1.5px solid #ddd;
      background: #f8f8f8;
      border-radius: 6px;
      cursor: pointer;
      font-size: .95rem;
      font-weight: 700;
      line-height: 1;
      transition: background .15s;
    }
    .ci-qty button:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .ci-qty span { min-width: 20px; text-align: center; font-weight: 600; }
    .ci-del {
      background: none;
      border: none;
      cursor: pointer;
      color: #ccc;
      font-size: 1rem;
      padding: .2rem;
      transition: color .15s;
    }
    .ci-del:hover { color: #e53e3e; }

    .cart-empty {
      text-align: center;
      color: #bbb;
      padding: 2rem 0;
      font-size: .95rem;
    }

    .cart-summary { border-top: 2px solid #f0f0f0; padding-top: 1rem; }
    .summary-row  { display: flex; justify-content: space-between; font-size: .9rem; margin-bottom: .5rem; color: #555; }
    .summary-row.total { font-size: 1.15rem; font-weight: 700; color: var(--dark); margin-top: .5rem; }

    .coupon-row {
      display: flex; gap: .5rem; margin: .9rem 0;
    }
    .coupon-row input {
      flex: 1; padding: .5rem .8rem; border: 1.5px solid #ddd; border-radius: 8px;
      font-size: .85rem; outline: none; transition: border-color .2s;
    }
    .coupon-row input:focus { border-color: var(--accent); }
    .coupon-row button {
      padding: .5rem .9rem; background: var(--dark); color: #fff;
      border: none; border-radius: 8px; cursor: pointer; font-size: .85rem; font-weight: 600;
    }
    .coupon-msg { font-size: .78rem; color: #28a745; margin-bottom: .5rem; min-height: 1.1em; }

    .btn-checkout {
      width: 100%;
      padding: .85rem;
      background: linear-gradient(135deg, var(--accent), #ff8c42);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s;
    }
    .btn-checkout:hover   { opacity: .88; }
    .btn-checkout:disabled{ opacity: .4; cursor: not-allowed; }

    .btn-clear {
      width: 100%; margin-top: .6rem;
      padding: .6rem;
      background: #f8f8f8; color: #666;
      border: 1.5px solid #ddd; border-radius: 10px;
      cursor: pointer; font-size: .85rem;
    }
    .btn-clear:hover { background: #ffe5df; color: var(--accent); border-color: var(--accent); }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 1.5rem; right: 1.5rem;
      background: var(--dark);
      color: #fff;
      padding: .7rem 1.2rem;
      border-radius: 10px;
      font-size: .9rem;
      box-shadow: 0 4px 20px rgba(0,0,0,.3);
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<nav>
  <div class="logo">&#128722; ShopEase</div>
  <button class="cart-icon" onclick="scrollToCart()" aria-label="Cart">
    &#128722;
    <span class="cart-badge" id="cartBadge">0</span>
  </button>
</nav>

<main>
  <!-- Products -->
  <section>
    <h2>Products</h2>
    <div class="product-grid" id="productGrid"></div>
  </section>

  <!-- Cart -->
  <aside class="cart-sidebar" id="cartSidebar">
    <h2>&#128722; Your Cart</h2>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-summary" id="cartSummary" style="display:none">
      <div class="summary-row"><span>Subtotal</span><span id="subtotalVal">$0.00</span></div>
      <div class="summary-row"><span>Discount</span><span id="discountVal">-$0.00</span></div>
      <div class="summary-row"><span>Shipping</span><span id="shippingVal">$5.00</span></div>
      <div class="summary-row total"><span>Total</span><span id="totalVal">$0.00</span></div>
      <div class="coupon-row">
        <input id="couponInput" type="text" placeholder="Coupon code…" aria-label="Coupon code"/>
        <button onclick="applyCoupon()">Apply</button>
      </div>
      <div class="coupon-msg" id="couponMsg"></div>
      <button class="btn-checkout" id="checkoutBtn" onclick="checkout()">Checkout</button>
      <button class="btn-clear" onclick="clearCart()">Clear Cart</button>
    </div>
  </aside>
</main>

<div class="toast" id="toast"></div>

<script>
  /* ─── Data ─── */
  const PRODUCTS = [
    { id:1, name:"Wireless Headphones", cat:"Electronics", price:79.99,  rating:4.5, img:"https://picsum.photos/seed/headphones/300/300" },
    { id:2, name:"Mechanical Keyboard", cat:"Electronics", price:129.95, rating:4.8, img:"https://picsum.photos/seed/keyboard/300/300" },
    { id:3, name:"Running Shoes",       cat:"Footwear",    price:64.99,  rating:4.3, img:"https://picsum.photos/seed/shoes/300/300" },
    { id:4, name:"Smart Watch",         cat:"Electronics", price:199.00, rating:4.6, img:"https://picsum.photos/seed/swatch/300/300" },
    { id:5, name:"Backpack Pro",        cat:"Bags",        price:49.50,  rating:4.4, img:"https://picsum.photos/seed/backpack/300/300" },
    { id:6, name:"Sunglasses UV400",    cat:"Accessories", price:34.99,  rating:4.2, img:"https://picsum.photos/seed/sunglasses/300/300" },
    { id:7, name:"Coffee Maker",        cat:"Kitchen",     price:89.95,  rating:4.7, img:"https://picsum.photos/seed/coffee/300/300" },
    { id:8, name:"Yoga Mat",            cat:"Sports",      price:27.00,  rating:4.1, img:"https://picsum.photos/seed/yoga/300/300" },
  ];

  const COUPONS = { SAVE10: 10, DEAL20: 20 };

  /* ─── State ─── */
  let cart    = JSON.parse(localStorage.getItem("sc_cart") || "[]");
  let discount = parseFloat(localStorage.getItem("sc_discount") || "0");
  let couponApplied = localStorage.getItem("sc_coupon") || "";

  /* ─── Helpers ─── */
  function saveCart() {
    localStorage.setItem("sc_cart", JSON.stringify(cart));
    localStorage.setItem("sc_discount", discount);
    localStorage.setItem("sc_coupon", couponApplied);
  }

  function stars(r) {
    const full  = Math.floor(r);
    const half  = r % 1 >= .5 ? 1 : 0;
    return "&#9733;".repeat(full) + (half ? "&#9734;" : "") + ` (${r})`;
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
  }

  /* ─── Render Products ─── */
  function renderProducts() {
    const grid = document.getElementById("productGrid");
    grid.innerHTML = PRODUCTS.map(p => {
      const inCart = cart.find(c => c.id === p.id);
      return `
      <div class="product-card">
        <img src="${p.img}" alt="${p.name}" loading="lazy"/>
        <div class="product-info">
          <div class="p-name">${p.name}</div>
          <div class="p-cat">${p.cat}</div>
          <div class="p-rating">${stars(p.rating)}</div>
          <div class="p-price">$${p.price.toFixed(2)}</div>
        </div>
        <button class="btn-add ${inCart ? 'in-cart' : ''}" id="btn-${p.id}" onclick="addToCart(${p.id})">
          ${inCart ? "&#10003; In Cart" : "+ Add to Cart"}
        </button>
      </div>`;
    }).join("");
  }

  /* ─── Cart CRUD ─── */
  function addToCart(id) {
    const product = PRODUCTS.find(p => p.id === id);
    const existing = cart.find(c => c.id === id);
    if (existing) {
      existing.qty++;
    } else {
      cart.push({ id, name: product.name, price: product.price, img: product.img, qty: 1 });
    }
    saveCart();
    renderProducts();
    renderCart();
    showToast(`"${product.name}" added to cart!`);
  }

  function changeQty(id, delta) {
    const item = cart.find(c => c.id === id);
    if (!item) return;
    item.qty += delta;
    if (item.qty < 1) cart = cart.filter(c => c.id !== id);
    saveCart();
    renderProducts();
    renderCart();
  }

  function removeFromCart(id) {
    cart = cart.filter(c => c.id !== id);
    saveCart();
    renderProducts();
    renderCart();
    showToast("Item removed.");
  }

  function clearCart() {
    cart = [];
    discount = 0;
    couponApplied = "";
    saveCart();
    renderProducts();
    renderCart();
  }

  /* ─── Render Cart ─── */
  function renderCart() {
    const container = document.getElementById("cartItems");
    const summary   = document.getElementById("cartSummary");

    document.getElementById("cartBadge").textContent = cart.reduce((s, c) => s + c.qty, 0);

    if (!cart.length) {
      container.innerHTML = `<div class="cart-empty">&#128722; Your cart is empty</div>`;
      summary.style.display = "none";
      return;
    }

    container.innerHTML = cart.map(item => `
      <div class="cart-item">
        <img src="${item.img}" alt="${item.name}"/>
        <div class="ci-info">
          <div class="ci-name">${item.name}</div>
          <div class="ci-price">$${(item.price * item.qty).toFixed(2)}</div>
        </div>
        <div class="ci-qty">
          <button onclick="changeQty(${item.id},-1)" aria-label="Decrease">&#8722;</button>
          <span>${item.qty}</span>
          <button onclick="changeQty(${item.id},1)" aria-label="Increase">+</button>
        </div>
        <button class="ci-del" onclick="removeFromCart(${item.id})" aria-label="Remove">&#10006;</button>
      </div>`).join("");

    const subtotal = cart.reduce((s, c) => s + c.price * c.qty, 0);
    const shipping = subtotal > 100 ? 0 : 5;
    const total    = subtotal - discount + shipping;

    document.getElementById("subtotalVal").textContent  = `$${subtotal.toFixed(2)}`;
    document.getElementById("discountVal").textContent  = `-$${discount.toFixed(2)}`;
    document.getElementById("shippingVal").textContent  = shipping === 0 ? "FREE" : `$${shipping.toFixed(2)}`;
    document.getElementById("totalVal").textContent     = `$${total.toFixed(2)}`;
    summary.style.display = "block";

    if (couponApplied) {
      document.getElementById("couponMsg").textContent = `Coupon "${couponApplied}" applied! -${COUPONS[couponApplied]}%`;
    }
  }

  /* ─── Coupon ─── */
  function applyCoupon() {
    const code = document.getElementById("couponInput").value.trim().toUpperCase();
    const msg  = document.getElementById("couponMsg");
    if (!COUPONS[code]) { msg.style.color="#e53e3e"; msg.textContent = "Invalid coupon code."; return; }
    if (couponApplied === code) { msg.style.color="#888"; msg.textContent = "Coupon already applied."; return; }
    const subtotal = cart.reduce((s, c) => s + c.price * c.qty, 0);
    discount = subtotal * COUPONS[code] / 100;
    couponApplied = code;
    saveCart();
    renderCart();
    msg.style.color = "#28a745";
    msg.textContent = `Coupon "${code}" applied! You saved $${discount.toFixed(2)}.`;
  }

  /* ─── Checkout ─── */
  function checkout() {
    alert(`Order placed! Total: ${document.getElementById("totalVal").textContent}\nThank you for shopping with us!`);
    clearCart();
  }

  function scrollToCart() {
    document.getElementById("cartSidebar").scrollIntoView({ behavior: "smooth" });
  }

  /* ─── Init ─── */
  renderProducts();
  renderCart();
</script>
</body>
</html>
